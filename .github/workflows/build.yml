# Reusable build: builds the game for Windows (tools/package.ps1 -> a zip) and for Linux (tools/package-linux.sh ->
# a tar.gz), in parallel. It is called by dev.yml (every push to dev), release.yml (manual release) and pr.yml
# (pull requests); it does not publish anything itself. The two archives are handed to the caller as the
# "package" (Windows) and "package-linux" artifacts. If either build fails, this whole workflow fails, so nothing
# is published unless both platforms built.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build. Empty means the ref that triggered the calling workflow.
        type: string
        default: ''
      channel:
        description: >-
          "dev" or "pr" makes a development version - the base version in src/Version.h plus a suffix such as
          -dev.47+a1b2c3d (channel, build number, short commit id). Empty means a plain release version.
        type: string
        default: ''
      build_number:
        description: The number shown in the development version suffix (run number, or pull request number).
        type: string
        default: ''
      artifact_retention_days:
        type: number
        default: 14
    outputs:
      version:
        description: Full version string that was built
        value: ${{ jobs.build.outputs.version }}
      zip_name:
        description: File name of the zip
        value: ${{ jobs.build.outputs.zip_name }}
      sha:
        description: The commit that was built
        value: ${{ jobs.build.outputs.sha }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022   # has Visual Studio 2022 (MSVC v143); pinned so a runner-image change can't surprise us
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      zip_name: ${{ steps.package.outputs.zip_name }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record the commit being built
        id: commit
        shell: powershell
        run: Add-Content -Path $env:GITHUB_OUTPUT -Value "sha=$(git rev-parse HEAD)"

      # tools/get-deps.ps1 verifies every download against a pinned SHA-256, so the cache only saves time
      # (and shields us from libsdl.org being slow); it can't change what gets built.
      - name: Cache the SDL libraries
        uses: actions/cache@v4
        with:
          path: third_party
          key: sdl-${{ hashFiles('tools/get-deps.ps1') }}

      - name: Build and package
        id: package
        shell: powershell
        env:
          CHANNEL: ${{ inputs.channel }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $suffix = ''
          if ($env:CHANNEL) {
            $short = (git rev-parse --short=7 HEAD).Trim()
            $suffix = "-$($env:CHANNEL).$($env:BUILD_NUMBER)+$short"
          }
          Write-Host "Version suffix: '$suffix'"
          # called in-process (not "powershell -File") so a suffix that starts with "-" is taken as a value
          & ./tools/package.ps1 -VersionSuffix $suffix

      - name: Keep the zip for the next job
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

  linux:
    runs-on: ubuntu-22.04   # an older glibc (2.35) than the newest image, so the binary runs on most current distributions
    timeout-minutes: 45
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # SDL2, SDL2_ttf and SDL2_mixer are compiled from source and linked into the game (see CMakeLists.txt), so all
      # that is needed here is what SDL itself needs in order to build its X11, Wayland, audio and OpenGL backends.
      # They are loaded at run time, so the finished game does not need these packages.
      - name: Install what SDL needs to build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxxf86vm-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev

      # tools/get-deps.sh verifies every download against a pinned SHA-256, so the cache only saves time.
      - name: Cache the SDL sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: sdl-linux-${{ hashFiles('tools/get-deps.sh') }}

      - name: Build and package
        env:
          CHANNEL: ${{ inputs.channel }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          suffix=""
          if [ -n "$CHANNEL" ]; then
            suffix="-${CHANNEL}.${BUILD_NUMBER}+$(git rev-parse --short=7 HEAD)"
          fi
          echo "Version suffix: '$suffix'"
          ./tools/package-linux.sh --suffix "$suffix"

      - name: Keep the archive for the next job
        uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
